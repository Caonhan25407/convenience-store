services:
  postgres:
    image: postgres:16-alpine
    container_name: storeweb-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - storeweb_postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: storeweb-backend
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Auth__CookieName: StoreWeb.Docker.Auth
      Auth__DataProtectionKeysPath: /var/lib/storeweb/data-protection-keys
      Auth__SeedAdmin__Email: ${AUTH_SEED_ADMIN_EMAIL:-}
      Auth__SeedAdmin__Password: ${AUTH_SEED_ADMIN_PASSWORD:-}
      Auth__SeedAdmin__DisplayName: ${AUTH_SEED_ADMIN_DISPLAY_NAME:-}
      Auth__SeedCustomer__Email: ${AUTH_SEED_CUSTOMER_EMAIL:-}
      Auth__SeedCustomer__Password: ${AUTH_SEED_CUSTOMER_PASSWORD:-}
      Auth__SeedCustomer__DisplayName: ${AUTH_SEED_CUSTOMER_DISPLAY_NAME:-}

      ConnectionStrings__DefaultConnection: >
        Host=postgres;
        Port=5432;
        Database=${POSTGRES_DB};
        Username=${POSTGRES_USER};
        Password=${POSTGRES_PASSWORD}

    ports:
      - "${BACKEND_PORT}:8080"

    volumes:
      - storeweb_data_protection_keys:/var/lib/storeweb/data-protection-keys

    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: storeweb-frontend
    restart: unless-stopped

    ports:
      - "${FRONTEND_PORT}:80"

    depends_on:
      - backend

volumes:
  storeweb_postgres_data:
  storeweb_data_protection_keys:
